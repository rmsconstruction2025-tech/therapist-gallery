  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:        #0b1a10;
      --bg2:       #0f2218;
      --green:     #1e4d30;
      --green2:    #2a6640;
      --green-lt:  #3d8c58;
      --cream:     #f0e9d6;
      --cream2:    #d6ccb4;
      --gold:      #c9a84c;
      --gold-lt:   #e8c97a;
      --text:      #e8e0d0;
      --muted:     #7a8f7f;
      --border:    rgba(201,168,76,.15);
      --card-bg:   rgba(15,34,24,.85);
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Georgia', 'Times New Roman', serif;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; font-family: inherit; }
    input, select, textarea { font-family: inherit; }
    img { display: block; max-width: 100%; }

    /* ── Animations ── */
    @keyframes fadeUp   { from{opacity:0;transform:translateY(28px)} to{opacity:1;transform:none} }
    @keyframes spin     { to{transform:rotate(360deg)} }
    @keyframes shimmer  { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
    @keyframes pulse    { 0%,100%{opacity:1} 50%{opacity:.5} }
    @keyframes float    { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    @keyframes leafSway { 0%,100%{transform:rotate(-3deg)} 50%{transform:rotate(3deg)} }

    .fade-up { animation: fadeUp .6s ease both; }
    .skel { background:linear-gradient(90deg,#0f2218 25%,#162e1e 50%,#0f2218 75%); background-size:200% 100%; animation:shimmer 1.5s ease infinite; border-radius:8px; }

    /* ══ NAV ══ */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 32px;
      background: rgba(11,26,16,.92);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(201,168,76,.12);
      transition: padding .3s;
    }
    .nav-logo { display:flex; align-items:center; gap:10px; }
    .nav-logo svg { flex-shrink:0; }
    .nav-logo-text { font-size:1.1rem; font-weight:700; color:var(--gold); letter-spacing:.5px; }
    .nav-logo-sub  { font-size:.65rem; color:var(--muted); letter-spacing:1.5px; text-transform:uppercase; }
    .nav-links { display:flex; gap:28px; align-items:center; }
    .nav-links a { font-size:.82rem; color:var(--cream2); letter-spacing:.8px; text-transform:uppercase; transition:color .2s; }
    .nav-links a:hover { color:var(--gold); }
    .nav-book-btn {
      background:linear-gradient(135deg,var(--green),var(--green2));
      color:var(--cream); border:1px solid var(--border);
      border-radius:24px; padding:9px 22px;
      font-size:.8rem; font-weight:700; letter-spacing:.5px;
      transition:all .2s;
    }
    .nav-book-btn:hover { background:linear-gradient(135deg,var(--green2),var(--green-lt)); box-shadow:0 4px 20px rgba(42,102,64,.4); }
    @media(max-width:680px){ .nav-links { display:none; } nav { padding:14px 20px; } }

    /* ══ HERO ══ */
    .hero {
      min-height: 100dvh;
      position: relative;
      display: flex; flex-direction:column; align-items:center; justify-content:center;
      text-align: center;
      padding: 120px 24px 80px;
      overflow: hidden;
    }
    .hero-bg {
      position:absolute; inset:0; z-index:0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 30%, rgba(42,102,64,.35) 0%, transparent 60%),
        linear-gradient(180deg, rgba(11,26,16,0) 0%, rgba(11,26,16,.95) 100%),
        url('https://images.unsplash.com/photo-1600334089648-b0d9d3028eb2?w=1400&q=80') center/cover no-repeat;
    }
    .hero-bg::after {
      content:''; position:absolute; inset:0;
      background:rgba(11,26,16,.55);
    }
    .hero-ornament { position:relative; z-index:1; display:flex; align-items:center; gap:14px; margin-bottom:24px; }
    .hero-ornament .line { height:1px; width:60px; background:linear-gradient(90deg,transparent,var(--gold)); }
    .hero-ornament .line.r { background:linear-gradient(90deg,var(--gold),transparent); }
    .hero-ornament .diamond {
      width:8px; height:8px; background:var(--gold);
      transform:rotate(45deg); flex-shrink:0;
    }
    .hero-badge {
      position:relative; z-index:1;
      display:inline-flex; align-items:center; gap:7px;
      background:rgba(201,168,76,.1); border:1px solid rgba(201,168,76,.25);
      border-radius:20px; padding:6px 16px; margin-bottom:20px;
      font-size:.72rem; color:var(--gold); letter-spacing:1.5px; text-transform:uppercase;
    }
    .hero-badge .dot { width:6px; height:6px; border-radius:50%; background:#4caf6e; animation:pulse 1.8s ease infinite; }
    .hero-title {
      position:relative; z-index:1;
      font-size:clamp(2.4rem,7vw,4.5rem);
      color:var(--cream); line-height:1.1; margin-bottom:12px;
      text-shadow:0 2px 24px rgba(0,0,0,.5);
    }
    .hero-title span { color:var(--gold); }
    .hero-sub {
      position:relative; z-index:1;
      font-size:clamp(.95rem,2.5vw,1.25rem);
      color:var(--cream2); max-width:560px; margin:0 auto 36px;
      line-height:1.65; font-style:italic;
    }
    .hero-ctas { position:relative; z-index:1; display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
    .btn-primary {
      background:linear-gradient(135deg,#1a4228,var(--green2));
      color:var(--cream); border:1px solid rgba(201,168,76,.3);
      border-radius:32px; padding:15px 36px;
      font-size:1rem; font-weight:700; letter-spacing:.5px;
      transition:all .25s; box-shadow:0 4px 24px rgba(0,0,0,.3);
    }
    .btn-primary:hover { transform:translateY(-2px); box-shadow:0 8px 32px rgba(42,102,64,.5); background:linear-gradient(135deg,var(--green2),var(--green-lt)); }
    .btn-wa {
      background:rgba(37,211,102,.12); border:1px solid rgba(37,211,102,.3);
      color:#4cfa8a; border-radius:32px; padding:15px 28px;
      font-size:.9rem; font-weight:700; letter-spacing:.3px;
      display:flex; align-items:center; gap:8px;
      transition:all .25s;
    }
    .btn-wa:hover { background:rgba(37,211,102,.22); transform:translateY(-2px); }
    .hero-scroll {
      position:absolute; bottom:32px; left:50%; transform:translateX(-50%);
      z-index:1; display:flex; flex-direction:column; align-items:center; gap:6px;
      color:var(--muted); font-size:.7rem; letter-spacing:1px; text-transform:uppercase;
      animation:float 2.5s ease infinite;
    }
    .hero-scroll svg { opacity:.5; }

    /* ══ SECTION COMMON ══ */
    section { padding: 80px 24px; }
    .section-inner { max-width:1080px; margin:0 auto; }
    .section-label {
      display:inline-flex; align-items:center; gap:8px;
      font-size:.68rem; color:var(--gold); letter-spacing:2px; text-transform:uppercase;
      margin-bottom:14px;
    }
    .section-label::before { content:''; display:block; width:28px; height:1px; background:var(--gold); }
    .section-title {
      font-size:clamp(1.7rem,4vw,2.6rem);
      color:var(--cream); line-height:1.2; margin-bottom:12px;
    }
    .section-sub { font-size:.95rem; color:var(--muted); line-height:1.7; max-width:560px; }
    .section-divider { height:1px; background:linear-gradient(90deg,transparent,var(--border),transparent); margin:80px 0 0; }

    /* ══ SERVICES ══ */
    #services { background:var(--bg2); }
    .services-grid {
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
      gap:20px; margin-top:48px;
    }
    .service-card {
      background:var(--card-bg);
      border:1px solid var(--border);
      border-radius:18px; padding:28px 22px;
      transition:all .25s;
      position:relative; overflow:hidden;
    }
    .service-card::before {
      content:''; position:absolute; top:0; left:0; right:0; height:2px;
      background:linear-gradient(90deg,transparent,var(--green2),transparent);
      opacity:0; transition:opacity .25s;
    }
    .service-card:hover { transform:translateY(-4px); border-color:rgba(201,168,76,.3); box-shadow:0 12px 40px rgba(0,0,0,.4); }
    .service-card:hover::before { opacity:1; }
    .service-icon { font-size:2rem; margin-bottom:14px; display:block; }
    .service-name { font-size:1rem; font-weight:700; color:var(--cream); margin-bottom:6px; }
    .service-desc { font-size:.78rem; color:var(--muted); line-height:1.6; margin-bottom:14px; }
    .service-price {
      font-size:.95rem; font-weight:700; color:var(--gold);
      background:rgba(201,168,76,.08); border:1px solid rgba(201,168,76,.18);
      border-radius:20px; padding:5px 14px; display:inline-block;
    }
    .service-duration { font-size:.7rem; color:var(--muted); margin-top:6px; }

    /* ══ THERAPISTS ══ */
    #therapists { background:var(--bg); }
    .therapist-notice {
      background:rgba(30,77,48,.3); border:1px solid rgba(201,168,76,.18);
      border-radius:12px; padding:14px 20px; margin-bottom:36px;
      font-size:.82rem; color:var(--cream2); display:flex; align-items:center; gap:10px;
    }
    .therapist-notice svg { flex-shrink:0; color:var(--gold); }
    .therapists-grid {
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
      gap:20px; margin-top:36px;
    }
    .th-card {
      background:var(--card-bg);
      border:1px solid var(--border);
      border-radius:18px; overflow:hidden;
      transition:all .25s;
    }
    .th-card:hover { transform:translateY(-4px); border-color:rgba(61,140,88,.4); box-shadow:0 12px 36px rgba(0,0,0,.5); }
    .th-photo {
      aspect-ratio:3/4; background:#0d2218;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:10px; position:relative; overflow:hidden;
    }
    .th-photo::before {
      content:''; position:absolute; inset:0;
      background:radial-gradient(ellipse at 50% 30%,rgba(42,102,64,.2),transparent 70%);
    }
    .th-avatar {
      width:80px; height:80px; border-radius:50%;
      background:rgba(42,102,64,.2); border:2px solid rgba(61,140,88,.3);
      display:flex; align-items:center; justify-content:center;
      position:relative; z-index:1;
    }
    .th-avatar svg { opacity:.5; }
    .th-number { font-size:.65rem; color:var(--muted); letter-spacing:1.5px; text-transform:uppercase; position:relative; z-index:1; }
    .th-status-dot {
      position:absolute; top:12px; left:12px; z-index:2;
      display:flex; align-items:center; gap:5px;
      background:rgba(0,0,0,.65); backdrop-filter:blur(8px);
      border-radius:20px; padding:4px 10px;
      font-size:.6rem; font-weight:700; color:#fff;
    }
    .th-panel { padding:14px; }
    .th-speciality { font-size:.82rem; font-weight:700; color:var(--cream); margin-bottom:4px; }
    .th-tag {
      display:inline-block; font-size:.65rem; color:var(--green-lt);
      background:rgba(61,140,88,.12); border:1px solid rgba(61,140,88,.2);
      border-radius:10px; padding:3px 9px; margin-bottom:12px;
    }
    .th-book-btn {
      width:100%; padding:10px; border-radius:10px;
      background:linear-gradient(135deg,var(--green),var(--green2));
      color:var(--cream); border:none;
      font-size:.78rem; font-weight:700; letter-spacing:.3px;
      transition:all .2s;
    }
    .th-book-btn:hover { background:linear-gradient(135deg,var(--green2),var(--green-lt)); }

    /* ══ BOOKING FORM ══ */
    #booking { background:var(--bg2); }
    .booking-wrap {
      display:grid; grid-template-columns:1fr 1fr; gap:60px; align-items:start; margin-top:48px;
    }
    @media(max-width:760px){ .booking-wrap { grid-template-columns:1fr; gap:32px; } }
    .booking-info-block { display:flex; flex-direction:column; gap:24px; }
    .booking-feature { display:flex; gap:14px; }
    .booking-feature-icon {
      width:42px; height:42px; flex-shrink:0;
      border-radius:12px; background:rgba(42,102,64,.2); border:1px solid rgba(61,140,88,.2);
      display:flex; align-items:center; justify-content:center; font-size:1.2rem;
    }
    .booking-feature h4 { font-size:.9rem; color:var(--cream); margin-bottom:4px; }
    .booking-feature p  { font-size:.78rem; color:var(--muted); line-height:1.6; }
    .chennai-notice {
      background:rgba(201,168,76,.08); border:1px solid rgba(201,168,76,.25);
      border-radius:12px; padding:14px 16px;
      font-size:.78rem; color:var(--gold); display:flex; align-items:center; gap:8px;
    }
    .form-card {
      background:rgba(15,34,24,.9); border:1px solid var(--border);
      border-radius:22px; padding:32px;
      box-shadow:0 20px 60px rgba(0,0,0,.4);
    }
    .form-title { font-size:1.2rem; color:var(--cream); margin-bottom:24px; font-weight:700; }
    .form-group { margin-bottom:18px; }
    .form-label { display:block; font-size:.74rem; color:var(--muted); letter-spacing:.8px; text-transform:uppercase; margin-bottom:7px; }
    .form-input, .form-select, .form-textarea {
      width:100%; padding:12px 16px;
      background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1);
      border-radius:12px; color:var(--text);
      font-size:.9rem; outline:none;
      transition:border-color .2s, box-shadow .2s;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color:rgba(61,140,88,.5);
      box-shadow:0 0 0 3px rgba(42,102,64,.2);
    }
    .form-select option { background:#0f2218; }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    @media(max-width:480px){ .form-row { grid-template-columns:1fr; } }
    .form-textarea { resize:vertical; min-height:80px; }
    .chennai-check {
      display:flex; align-items:center; gap:10px;
      padding:14px 16px;
      background:rgba(201,168,76,.05); border:1px solid rgba(201,168,76,.15);
      border-radius:12px; margin-bottom:18px;
      font-size:.82rem; color:var(--cream2); cursor:pointer;
    }
    .chennai-check input[type=checkbox] { width:16px; height:16px; accent-color:var(--green2); flex-shrink:0; }
    .form-submit {
      width:100%; padding:15px; border-radius:14px;
      background:linear-gradient(135deg,#1a4228,var(--green2));
      color:var(--cream); border:1px solid rgba(201,168,76,.2);
      font-size:1rem; font-weight:700; letter-spacing:.4px;
      transition:all .25s;
    }
    .form-submit:hover:not(:disabled) { background:linear-gradient(135deg,var(--green2),var(--green-lt)); transform:translateY(-1px); box-shadow:0 8px 28px rgba(42,102,64,.4); }
    .form-submit:disabled { opacity:.5; cursor:not-allowed; }
    .form-error { color:#e74c3c; font-size:.78rem; margin-top:6px; }
    .form-success {
      text-align:center; padding:24px;
      background:rgba(42,102,64,.15); border:1px solid rgba(61,140,88,.3);
      border-radius:16px;
    }
    .form-success h3 { color:var(--cream); margin-bottom:8px; }
    .form-success p { color:var(--muted); font-size:.85rem; }

    /* ══ LOCATION ══ */
    #location { background:var(--bg); }
    .location-wrap { display:grid; grid-template-columns:1fr 1fr; gap:48px; margin-top:48px; align-items:start; }
    @media(max-width:760px){ .location-wrap { grid-template-columns:1fr; } }
    .location-details { display:flex; flex-direction:column; gap:20px; }
    .location-item { display:flex; gap:14px; }
    .location-icon {
      width:40px; height:40px; flex-shrink:0;
      background:rgba(42,102,64,.2); border:1px solid rgba(61,140,88,.2);
      border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:1.1rem;
    }
    .location-item h4 { font-size:.82rem; color:var(--gold); margin-bottom:4px; letter-spacing:.5px; text-transform:uppercase; }
    .location-item p  { font-size:.88rem; color:var(--cream2); line-height:1.6; }
    .hours-table { width:100%; border-collapse:collapse; margin-top:8px; }
    .hours-table td { padding:5px 0; font-size:.82rem; }
    .hours-table td:first-child { color:var(--muted); width:90px; }
    .hours-table td:last-child  { color:var(--cream2); }
    .hours-table .today td { color:var(--gold); font-weight:700; }
    .map-embed {
      border-radius:18px; overflow:hidden;
      border:1px solid var(--border);
      aspect-ratio:4/3;
    }
    .map-embed iframe { width:100%; height:100%; border:none; }

    /* ══ FOOTER ══ */
    footer {
      background:var(--bg2);
      border-top:1px solid var(--border);
      padding:40px 24px;
      text-align:center;
    }
    .footer-logo { font-size:1.3rem; color:var(--gold); font-weight:700; margin-bottom:8px; }
    .footer-tagline { font-size:.78rem; color:var(--muted); letter-spacing:1px; margin-bottom:20px; }
    .footer-links { display:flex; gap:24px; justify-content:center; flex-wrap:wrap; margin-bottom:20px; }
    .footer-links a { font-size:.78rem; color:var(--muted); transition:color .2s; }
    .footer-links a:hover { color:var(--gold); }
    .footer-copy { font-size:.7rem; color:rgba(122,143,127,.4); }

    /* ══ FLOATING WA ══ */
    .wa-float {
      position:fixed; bottom:24px; right:24px; z-index:200;
      width:58px; height:58px; border-radius:50%;
      background:linear-gradient(135deg,#128c7e,#25d366);
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 4px 20px rgba(37,211,102,.4);
      animation:float 3s ease infinite;
      transition:transform .2s, box-shadow .2s;
      text-decoration:none;
    }
    .wa-float:hover { transform:scale(1.1) !important; box-shadow:0 8px 28px rgba(37,211,102,.5); }
    .wa-float svg { width:28px; height:28px; }
    .wa-tooltip {
      position:absolute; right:68px; top:50%; transform:translateY(-50%);
      background:rgba(11,26,16,.95); border:1px solid rgba(37,211,102,.3);
      border-radius:8px; padding:6px 12px; white-space:nowrap;
      font-size:.75rem; color:#4cfa8a; font-family:Georgia,serif;
      pointer-events:none; opacity:0; transition:opacity .2s;
    }
    .wa-float:hover .wa-tooltip { opacity:1; }
  </style>
</head>
<body>

<!-- ══ NAV ══ -->
<nav>
  <div class="nav-logo">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
      <circle cx="14" cy="14" r="13" stroke="#c9a84c" stroke-width="1.5" stroke-dasharray="3 2"/>
      <path d="M14 6c0 0-5 4-5 8s5 8 5 8" stroke="#3d8c58" stroke-width="2" stroke-linecap="round"/>
      <path d="M14 6c0 0 5 4 5 8s-5 8-5 8" stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="14" cy="14" r="2" fill="#c9a84c"/>
    </svg>
    <div>
      <div class="nav-logo-text">Feel Free</div>
      <div class="nav-logo-sub">Doorstep Massage · Chennai</div>
    </div>
  </div>
  <div class="nav-links">
    <a href="#services">Services</a>

// DiceBear AI avatar seeds — each gives a unique illustrated persona
const AVATAR_SEEDS = ['Lily','Jade','Zara','Maya','Aria','Nova','Luna','Ivy'];

function TherapistCard({ therapist, index, onSelect, selected }) {
  const isOnline = therapist.available;
  const ts = therapist.lastActiveAt?.toMillis?.() ?? 0;
  const agoMin = ts ? (Date.now() - ts) / 60000 : 9999;
  const statusLabel = isOnline ? 'Online' : agoMin < 30 ? `${Math.floor(agoMin)}m ago` : 'Offline';
  const dotColor    = isOnline ? '#4cfa8a' : agoMin < 30 ? '#f39c12' : '#555';

  // Derive location area: use speciality if it mentions a place, else 'Chennai'
  const speciality = therapist.speciality || 'Massage Specialist';
  const areaKeywords = ['poonamalee','velachery','anna nagar','t nagar','tambaram','adyar','porur','perambur','chromepet','guindy','mylapore'];
  const lowerSpec = speciality.toLowerCase();
  const knownArea = areaKeywords.find(k => lowerSpec.includes(k));
  const areaLabel = knownArea
    ? knownArea.replace(/\b\w/g, c => c.toUpperCase())
    : (therapist.bio || '').split(' ').slice(0,3).join(' ') || 'Chennai';

  // Clean speciality text — if it's just a location string, show "Massage Specialist"
  const displaySpeciality = knownArea ? 'Massage Specialist' : speciality;

  const seed = AVATAR_SEEDS[index % AVATAR_SEEDS.length];
  const avatarUrl = `https://api.dicebear.com/7.x/personas/svg?seed=${seed}&backgroundColor=162e1e&backgroundType=solid`;

  const handleBook = () => {
    document.getElementById('booking')?.scrollIntoView({ behavior:'smooth' });
    onSelect && onSelect(index);
  };

  return (
    <div className="th-card fade-up" style={selected ? {border:'1.5px solid var(--green-lt)',boxShadow:'0 0 0 3px rgba(61,140,88,.2)'} : {}}>
      <div className="th-photo" style={{position:'relative',background:'#0d2218'}}>
        <div className="th-status-dot">
          <span style={{width:'6px',height:'6px',borderRadius:'50%',background:dotColor,display:'inline-block'}}/>
          {statusLabel}
        </div>
        {/* AI-generated illustrated avatar */}
        <img
          src={avatarUrl}
          alt={`Therapist #${index+1}`}
          style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}
          loading="lazy"
        />
        {/* Location badge — bottom of photo */}
        <div style={{position:'absolute',bottom:'10px',left:'50%',transform:'translateX(-50%)',zIndex:2,
          background:'rgba(0,0,0,.7)',backdropFilter:'blur(8px)',borderRadius:'20px',

      <div className="th-panel">
        <div className="th-speciality">{displaySpeciality}</div>

        <button className="th-book-btn" onClick={handleBook}>
          {selected ? '✓ Selected' : 'Select Therapist'}

      </div>

  );
}

// Shared state for selected therapist (lifted to App level via window)
function Therapists() {
  const [therapists, setTherapists] = useState(null);

  useEffect(()=>{
    db.collection('therapists')
      .where('onDuty','==',true)
      .get()
      .then(snap=>{
        const list = snap.docs.map(d=>({id:d.id,...d.data()})).filter(t=>t.name||t.speciality);

          return db.collection('therapists').limit(8).get().then(s=>{
            setTherapists(s.docs.map(d=>({id:d.id,...d.data()})));
          });
        }
        setTherapists(list);
      })
      .catch(()=>setTherapists([]));
  },[]);

  const handleSelect = (idx) => {

  return (

// BOOKING FORM
// ═══════════════════════════════════════
function BookingForm() {
  const [form, setForm] = useState({
    name:'', phone:'', address:'', service:'', therapist:'', date:'', time:'', notes:'', chennai:false
  });
  const [errors, setErrors]   = useState({});
  const [success, setSuccess] = useState(false);
  const [sending, setSending] = useState(false);

  const today = new Date().toISOString().split('T')[0];
  const set = (k,v) => setForm(f=>({...f,[k]:v}));

  // Pick up therapist selection made from cards section
  useEffect(()=>{
    const check = setInterval(()=>{
      const sel = window.__selectedTherapist;
      if (sel && sel.index !== undefined) {
        const label = `Therapist #${sel.index+1}${sel.data?.speciality ? ' — ' + sel.data.speciality : ''}`;
        setForm(f=>({...f, therapist: label}));
      }
    }, 500);
    return ()=>clearInterval(check);
  },[]);

  const validate = () => {
    const e = {};
    if (!form.name.trim())    e.name    = 'Please enter your name';
    if (!/^\d{10}$/.test(form.phone.replace(/\s/g,''))) e.phone = 'Enter a valid 10-digit mobile number';
    if (!form.address.trim()) e.address = 'Please enter your doorstep address';
    if (!form.service)        e.service = 'Please select a service';
    if (!form.date)           e.date    = 'Please pick a preferred date';
    if (!form.time)           e.time    = 'Please pick a preferred time';
    if (!form.chennai)        e.chennai = 'Booking is available for Chennai only';
    return e;
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    const errs = validate();
    if (Object.keys(errs).length) { setErrors(errs); return; }
    setErrors({});
    setSending(true);
    const msg = [
      `Hi! I'd like to book a doorstep massage with Feel Free.`,
      ``,
      `📋 *Booking Details*`,
      `Name: ${form.name}`,
      `Phone: +91${form.phone}`,
      `Address: ${form.address}`,
      `Service: ${form.service}`,
      form.therapist ? `Therapist Preference: ${form.therapist}` : '',
      `Date: ${form.date}`,
      `Time: ${form.time}`,
      form.notes ? `Notes: ${form.notes}` : '',
    ].filter(Boolean).join('\n');
    setTimeout(()=>{
      // Meta Pixel — Lead event (booking intent)
      if (window.fbq) fbq('track', 'Lead', { content_name: form.service, content_category: 'Doorstep Massage' });
      window.open(`https://wa.me/${ADMIN_WA}?text=${encodeURIComponent(msg)}`, '_blank');
      setSuccess(true);
      setSending(false);
    }, 600);
  };

  if (success) return (
    <section id="booking">
      <div className="section-inner">
        <div className="booking-wrap">
          <div/>
          <div className="form-success">
            <div style={{fontSize:'2.5rem',marginBottom:'12px'}}>🌿</div>
            <h3>WhatsApp opened!</h3>
            <p style={{marginBottom:'16px'}}>Your booking details are pre-filled. Just tap Send — we'll confirm and our therapist will come to your doorstep.</p>
            <button onClick={()=>{setSuccess(false);setForm({name:'',phone:'',address:'',service:'',therapist:'',date:'',time:'',notes:'',chennai:false});window.__selectedTherapist=null;}}
              style={{background:'var(--green2)',color:'var(--cream)',border:'none',borderRadius:'10px',padding:'10px 24px',fontSize:'.85rem',fontWeight:'700',cursor:'pointer'}}>
              Book Another
            </button>
          </div>
        </div>
      </div>
    </section>
  );

  return (
    <section id="booking">
      <div className="section-inner">
        <div className="section-label">Reserve your session</div>
        <h2 className="section-title">Book Your Appointment</h2>
        <p className="section-sub">Our therapist will come to your home. Fill the form and we'll confirm via WhatsApp within 15 minutes.</p>
        <div className="booking-wrap">
          {/* Info */}
          <div className="booking-info-block">
            <div className="chennai-notice">
              <span>📍</span>
              Doorstep service — <strong style={{marginLeft:4}}>Chennai only</strong>
            </div>
            {[
              { icon:'🏠', title:'We Come To You',      desc:'Our therapist travels to your home, hotel, or office anywhere in Chennai.' },
              { icon:'🕐', title:'Flexible Hours',       desc:'Sessions available 9 AM – 9 PM, 7 days a week including weekends.' },
              { icon:'🔒', title:'Safe & Certified',     desc:'All therapists are certified professionals. Your privacy is our priority.' },
              { icon:'💳', title:'Pay on Arrival',       desc:'No advance payment. Pay in cash or UPI when the therapist arrives.' },
            ].map(f=>(
              <div key={f.title} className="booking-feature">
                <div className="booking-feature-icon">{f.icon}</div>
                <div>
                  <h4>{f.title}</h4>
                  <p>{f.desc}</p>
                </div>
              </div>
            ))}
          </div>
          {/* Form */}
          <div className="form-card">
            <div className="form-title">Book a Session</div>
            <form onSubmit={handleSubmit} noValidate>
              <div className="form-row">
                <div className="form-group">
                  <label className="form-label">Full Name *</label>
                  <input className="form-input" placeholder="Your name" value={form.name} onChange={e=>set('name',e.target.value)}/>
                  {errors.name && <div className="form-error">{errors.name}</div>}
                </div>
                <div className="form-group">
                  <label className="form-label">Mobile Number *</label>
                  <input className="form-input" placeholder="10-digit number" type="tel" value={form.phone} onChange={e=>set('phone',e.target.value.replace(/\D/g,'').slice(0,10))}/>
                  {errors.phone && <div className="form-error">{errors.phone}</div>}
                </div>
              </div>
              <div className="form-group">
                <label className="form-label">Your Doorstep Address *</label>
                <input className="form-input" placeholder="Flat/House no., Street, Area, Chennai" value={form.address} onChange={e=>set('address',e.target.value)}/>
                {errors.address && <div className="form-error">{errors.address}</div>}
              </div>
              <div className="form-row">
                <div className="form-group">
                  <label className="form-label">Service *</label>
                  <select className="form-select" value={form.service} onChange={e=>set('service',e.target.value)}>
                    <option value="">Select a treatment</option>
                    {SERVICES.map(s=><option key={s.name} value={s.name}>{s.name} — {s.price}</option>)}
                    <option value="Not sure">Not sure — need recommendation</option>
                  </select>
                  {errors.service && <div className="form-error">{errors.service}</div>}
                </div>
                <div className="form-group">
                  <label className="form-label">Therapist</label>
                  <input
                    className="form-input"
                    placeholder="Auto-filled when selected above ↑"
                    value={form.therapist}
                    onChange={e=>set('therapist',e.target.value)}
                    style={form.therapist ? {borderColor:'rgba(61,140,88,.5)',background:'rgba(42,102,64,.08)'} : {}}
                  />
                  {form.therapist && <div style={{fontSize:'.7rem',color:'var(--green-lt)',marginTop:'4px'}}>✓ Therapist selected from above</div>}
                </div>
              </div>
              <div className="form-row">
                <div className="form-group">
                  <label className="form-label">Preferred Date *</label>
                  <input className="form-input" type="date" min={today} value={form.date} onChange={e=>set('date',e.target.value)}/>
                  {errors.date && <div className="form-error">{errors.date}</div>}
                </div>
                <div className="form-group">
                  <label className="form-label">Preferred Time *</label>
                  <select className="form-select" value={form.time} onChange={e=>set('time',e.target.value)}>
                    <option value="">Select time</option>
                    {['9:00 AM','10:00 AM','11:00 AM','12:00 PM','1:00 PM','2:00 PM','3:00 PM','4:00 PM','5:00 PM','6:00 PM','7:00 PM','8:00 PM'].map(t=><option key={t} value={t}>{t}</option>)}
                  </select>
                  {errors.time && <div className="form-error">{errors.time}</div>}
                </div>
              </div>
              <div className="form-group">
                <label className="form-label">Any notes (optional)</label>
                <textarea className="form-textarea" placeholder="Medical conditions, preferences, floor number, gate code…" value={form.notes} onChange={e=>set('notes',e.target.value)}/>
              </div>
              <label className="chennai-check">
                <input type="checkbox" checked={form.chennai} onChange={e=>set('chennai',e.target.checked)}/>
                I confirm I am located in Chennai
              </label>
              {errors.chennai && <div className="form-error" style={{marginBottom:'12px'}}>{errors.chennai}</div>}
              <button type="submit" className="form-submit" disabled={sending}>
                {sending
                  ? <span>Opening WhatsApp… <span style={{display:'inline-block',animation:'spin .8s linear infinite'}}>⟳</span></span>
                  : '📲 Send Booking via WhatsApp'
                }
              </button>
            </form>
          </div>
        </div>
      </div>
    </section>
  );
}
